services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-projeto_radiante}
      POSTGRES_USER: ${POSTGRES_USER:-radiante}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radiante_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-radiante} -d ${POSTGRES_DB:-projeto_radiante}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - projeto_radiante_postgres:/var/lib/postgresql/data

volumes:
  projeto_radiante_postgres:
